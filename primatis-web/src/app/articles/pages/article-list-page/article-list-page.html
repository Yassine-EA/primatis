<h1>Articles</h1>

@if (loading() && rows().length === 0 && !error()) {
  <app-loading-state message="Chargement des articles…" />
} @else if (error(); as currentError) {
  <app-error-state [message]="currentError.message" [showRetry]="true" (retry)="retry()" />
} @else if (rows().length === 0) {
  <app-empty-state title="Aucun article" message="Aucun article n’est publié pour le moment." />
} @else {
  <p-table
    [value]="rows()"
    [lazy]="true"
    [lazyLoadOnInit]="false"
    [paginator]="true"
    [rows]="20"
    [first]="0"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    (onLazyLoad)="onLazyLoad($event)"
  >
    <ng-template pTemplate="header">
      <tr>
        <th scope="col">Titre</th>
        <th scope="col">Résumé</th>
        <th scope="col">Auteur</th>
        <th scope="col">Publié le</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>
          <a [routerLink]="['/articles', row.slug]">{{ row.title }}</a>
        </td>
        <td>{{ row.summary ?? '—' }}</td>
        <td>{{ authorName(row.author) }}</td>
        <td>{{ row.publishedAt }}</td>
      </tr>
    </ng-template>
  </p-table>
}
