spring:
  application:
    name: primatis-api

  datasource:
    # L'URL n'est pas un secret : elle est fixée par profil et n'est pas
    # surchargeable par variable d'environnement (celles-ci priment sur les
    # fichiers application*.yml, y compris sur une valeur en dur d'un profil).
    url: jdbc:postgresql://localhost:5432/primatis_dev
    username: ${SPRING_DATASOURCE_USERNAME:primatis}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # DEV-ARTICLES-MEDIA (DEV-DEC-0079) : plafond technique volontairement
  # au-dessus de la limite métier réelle (5 Mio, ArticleMediaService) —
  # cette dernière s'applique donc normalement en premier, avec un message
  # d'erreur clair (ARTICLE_MEDIA_FILE_TOO_LARGE) ; ce plafond ne reste
  # qu'un garde-fou résiduel (GlobalExceptionHandler#handleMaxUploadSizeExceeded).
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB

# Infrastructure JWT RS256 (DEV-03.7). Aucune valeur ici n'est un secret :
# accessTokenTtl est une configuration technique (n'appartient pas à
# application_setting) ; privateKeyLocation/publicKeyLocation ne sont que
# des CHEMINS, jamais un contenu de clé. Les fichiers réels sont fournis par
# l'environnement (PRIMATIS_JWT_PRIVATE_KEY_PATH / _PUBLIC_KEY_PATH),
# jamais commités.
primatis:
  security:
    jwt:
      issuer: ${PRIMATIS_JWT_ISSUER:primatis-api}
      audience: ${PRIMATIS_JWT_AUDIENCE:primatis-api}
      access-token-ttl: PT1H
      private-key-location: ${PRIMATIS_JWT_PRIVATE_KEY_PATH}
      public-key-location: ${PRIMATIS_JWT_PUBLIC_KEY_PATH}
    # Origines CORS autorisées (DEV-03.8), configuration technique — pas
    # application_setting. Défaut : port standard du serveur de
    # développement Angular local, surchargeable par variable
    # d'environnement (liste séparée par des virgules).
    cors:
      allowed-origins: ${PRIMATIS_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # DEV-ARTICLES-MEDIA (DEV-DEC-0079) : dossier filesystem de stockage des
  # images Article — distinct de l'URL publique (/media/articles/**,
  # ArticleMediaWebConfig/SecurityConfig, jamais configurable, structurel).
  # Chemin relatif au répertoire de travail du processus backend.
  article-media:
    storage-path: ${PRIMATIS_ARTICLE_MEDIA_STORAGE_PATH:./public/media/articles}
