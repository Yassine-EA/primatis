spring:
  application:
    name: primatis-api

  datasource:
    # DEV-16.G3.5 — profil pour le bundle Full consolidé contre primatis_staging
    # (jamais primatis_dev, primatis_preview ni primatis_test),
    # même convention que application-e2e.yml : URL fixe, non surchargeable
    # par SPRING_DATASOURCE_URL.
    url: jdbc:postgresql://localhost:5432/primatis_staging
    username: ${SPRING_DATASOURCE_USERNAME:primatis}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# DEV-ARTICLES-MEDIA (DEV-DEC-0079) : dossier dédié, même principe
# d'isolation que primatis_staging vs primatis_dev.
primatis:
  article-media:
    storage-path: ${PRIMATIS_ARTICLE_MEDIA_STORAGE_PATH:./public/media/articles-staging}
