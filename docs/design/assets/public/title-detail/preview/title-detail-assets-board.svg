  </defs>
  <image x="70" y="205" width="1460" height="244" preserveAspectRatio="xMidYMid slice" clip-path="url(#desktop)" xlink:href="../hero/title-detail-hero-1920.webp"/>
  <text x="120" y="315" fill="#ffffff" font-family="Georgia, serif" font-size="52" font-weight="700">Titre du livre</text>
