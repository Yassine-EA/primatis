  <text x="70" y="520" fill="#082c46" font-family="Arial, sans-serif" font-weight="700" font-size="18">TABLETTE · 1280 × 320</text>
  <image x="70" y="560" width="900" height="225" preserveAspectRatio="xMidYMid slice" clip-path="url(#tablet)" xlink:href="../hero/title-detail-hero-1280.webp"/>

  <rect x="1010" y="560" width="520" height="225" rx="16" fill="#ffffff" stroke="#d8dfe5"/>
