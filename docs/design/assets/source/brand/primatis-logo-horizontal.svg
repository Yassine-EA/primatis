<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" role="img" aria-labelledby="primatis-logo-h-title">
  <title id="primatis-logo-h-title">PRIMATIS — Bibliothèque publique Georges Lemaître</title>
  <defs>
    <g id="primatis-mark">
      <circle cx="32" cy="32" r="31" fill="#082B40" />
      <g fill="none" stroke="#D7A16E" stroke-width="1" opacity="0.65">
        <ellipse cx="32" cy="32" rx="23" ry="11.5" />
        <ellipse cx="32" cy="32" rx="23" ry="11.5" transform="rotate(60 32 32)" />
        <ellipse cx="32" cy="32" rx="23" ry="11.5" transform="rotate(120 32 32)" />
      </g>
      <circle cx="9" cy="32" r="1.6" fill="#D7A16E" />
      <circle cx="49.9" cy="21.2" r="1.4" fill="#D7A16E" />
      <circle cx="49.9" cy="42.8" r="1.4" fill="#D7A16E" />
      <path
        d="M32 24.5 L34.1 29.9 L39.8 30.2 L35.3 33.8 L36.9 39.3 L32 36.1 L27.1 39.3 L28.7 33.8 L24.2 30.2 L29.9 29.9 Z"
        fill="#B87333"
      />
    </g>
  </defs>

  <use href="#primatis-mark" x="4" y="4" />

  <!--
    Texte SVG (jamais converti en tracés) : dépend de la pile serif système
    déjà utilisée partout dans l'application (token CSS font éditorial,
    Georgia, Times New Roman, serif) donc aucune police externe requise au
    runtime, même fallback documenté que le reste de PRIMATIS (DEV-15.2,
    reconduit DESIGN-V2-A). Rendu correct sur toute plateforme disposant
    d'une police serif système ; dégrade vers la serif par défaut du
    navigateur sinon, jamais un texte manquant.
  -->
  <text x="80" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#082B40">PRIMATIS</text>
  <text x="81" y="56" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#46515F">
    Bibliothèque publique Georges Lemaître
  </text>
</svg>
