[project]
name = "primatis-data-seeding"
version = "0.1.0"
description = "Outils de préparation et de génération des données de démonstration PRIMATIS"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "bcrypt>=5.0,<6",
    "openpyxl>=3.1.5,<4",
    "psycopg[binary]>=3.3,<4",
    "xlrd>=2.0.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "xlwt>=1.3,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
