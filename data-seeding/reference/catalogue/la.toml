# Socle éditorial LA — voir fr.toml. Élargi DEV-16.5 §4/§5.
#
# Le latin n'ayant pas de période « contemporaine » (langue non
# vernaculaire depuis l'Antiquité), la diversité visée porte ici sur les
# genres/époques de la littérature latine antique (épopée, poésie
# lyrique, rhétorique/philosophie) plutôt que sur classique/moderne/
# contemporain.

