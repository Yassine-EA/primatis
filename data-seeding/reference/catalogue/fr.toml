# Socle éditorial FR — DEV-16.2 §4/DEC-16.3-02, élargi DEV-16.5 §4/§5.
#
# Liste éditoriale EXPLICITE, traçable, révisable : une sélection
# d'auteurs de référence francophones utilisée pour PILOTER une partie
# de la composition du fonds FR, PAS pour remplacer la collecte
# bibliographique générale. Aucune métadonnée bibliographique n'est
# inventée ici — seul `author_key` est utilisé, et sert uniquement à
# ORIENTER une requête Open Library réelle, jamais à fabriquer un Title.
#
# Chaque `author_key` a été vérifié RÉELLEMENT via
# `https://openlibrary.org/search/authors.json?q=<nom>` — jamais deviné.
# `work_count` est la valeur réelle observée à la vérification
# (indicatif, non maintenu à jour automatiquement).
#
# Diversité visée (DEV-16.5 §5) : classique / moderne / contemporain,
# plusieurs formes (roman, théâtre, poésie, essai).

[[authors]]
author_key = "OL107571A"
full_name = "Victor Hugo"
verified_at = "2026-09-11"
verified_via = "openlibrary.org/search/authors.json?q=Victor+Hugo"
work_count_at_verification = 4623
period = "classique (XIXe siècle)"
form = "roman, poésie"
selection_rationale = "Figure majeure de la littérature française du XIXe siècle, œuvre abondante et bibliographiquement bien référencée sur Open Library."

